name: Build

# Docs, the README's images and the test rig don't go into any build, so changes to only those
# skip it. Tags always build (GitHub doesn't apply path filters to tag pushes), and the
# apworld's own docs ship inside it.
on:
  push:
    branches: ["*"]
    tags: ["*"]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!rig/**"
      - "apworld/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!rig/**"
      - "apworld/**"

env:
  SYMGEN_VERSION: v1.3.4

jobs:
  build:
    name: Build ${{matrix.platform}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: ios-arm64
            runner: macos-latest
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64
          - platform: windows-arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
          - platform: android-aarch64
            runner: ubuntu-latest
            android_ndk: "29.0.14206865"

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      # The mod refuses a seed whose data_version differs from its own, so if its file list
      # and data.py's ever disagree it would refuse every seed. One host platform is enough.
      - name: Check data version parity
        if: matrix.platform == 'linux-x86_64'
        run: python3 tools/check_data_version.py build/ap_gen_test

      # Host tests (text sanitising, compression, emoji, cover matching) where the runner can
      # run what it built. The TLS cases need outside servers, so they stay a local check.
      - name: Host tests
        if: contains(fromJSON('["linux-x86_64", "linux-aarch64", "macos-arm64", "windows-amd64"]'), matrix.platform)
        shell: bash
        run: |
          exe=build/tls_test
          [[ -f build/tls_test.exe ]] && exe=build/tls_test.exe
          "$exe" --offline

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release step creates a release from a tag
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Build apworld
        run: python3 tools/build_apworld.py --out combined/tp_dusklight.apworld

      - name: Upload apworld
        uses: actions/upload-artifact@v7
        with:
          name: apworld
          path: combined/*.apworld
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          # .github/release-notes.md always opens with the install guide; update its
          # "What's new" section as part of every version bump. A tag with a suffix
          # (v1.8.0-beta.1) is published as a prerelease.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            combined/*.dusk combined/*.apworld presets/*.yaml \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md $pre
